<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live exchange · Creative AI Lab</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/client.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Creative AI Lab / P11</p>
      <h1>Live exchange</h1>
      <p>Open a second tab. Send a thought. See it arrive in both.</p>
      <p id="status" role="status">Connecting…</p>
    </header>
    <section aria-label="Conversation">
      <p id="empty">A shared space for a short conversation.</p>
      <ul id="messages" aria-label="Messages" aria-live="polite" aria-relevant="additions"></ul>
    </section>
    <form id="form">
      <label for="input">Your message</label>
      <div class="compose">
        <input id="input" autocomplete="off" maxlength="500" required aria-describedby="hint feedback">
        <button type="submit" disabled>Send</button>
      </div>
      <p id="hint">Text only · up to 500 characters · no saved history</p>
      <p id="feedback" role="alert"></p>
    </form>
    <footer>Local prototype. One room, no accounts. Rejoining receives future messages only.</footer>
  </main>
</body>
</html>
