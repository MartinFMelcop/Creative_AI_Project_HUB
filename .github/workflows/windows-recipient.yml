name: Windows recipient
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-recipient.yml'
      - 'martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/delivery/authored-scene-windows/**'
      - 'martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/delivery/authored-scene/**'
      - 'martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/north-star/authored-scene/**'
      - 'martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/north-star/csharp/**'
      - 'martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab/package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-windows-recipient:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          # Preserve exact protected/source byte identities on the Windows checkout.
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          # Preserve long original reference filenames without renaming or omitting them.
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Record actual host and token without changing URL reservations or privileges
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $hostRecord = @{ os = [Environment]::OSVersion.VersionString; architecture = $env:PROCESSOR_ARCHITECTURE; administrator = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); powershell = $PSVersionTable.PSVersion.ToString(); commit = $env:GITHUB_SHA }
          $hostRecord | ConvertTo-Json | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/windows-host.json"
          "PWSH_EXE=$((Get-Command pwsh).Source)" >> $env:GITHUB_ENV
      - name: Acquire official runtime; the package rejects any SHA512 or file drift
        run: Invoke-WebRequest -Uri 'https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.12/dotnet-runtime-10.0.12-win-x64.zip' -OutFile "$env:RUNNER_TEMP/windows-runtime.zip"
      - name: Install existing locked browser instrument
        run: |
          npm ci --prefix projects/realtime-integration-lab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location projects/realtime-integration-lab
          npx --no-install playwright-core install chromium
          $code = $LASTEXITCODE
          Pop-Location
          exit $code
      - name: Execute reproducible extracted private-runtime Windows recipient
        run: python delivery/authored-scene-windows/verify.py --runtime-archive "$env:RUNNER_TEMP/windows-runtime.zip" --compare delivery/authored-scene-windows/dist/authored-scene-demo-win-x64.zip --output "$env:RUNNER_TEMP/windows-recipient"
      - name: Retain actual platform results, negatives, captures and recipient
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-recipient
          path: |
            ${{ runner.temp }}/windows-host.json
            ${{ runner.temp }}/windows-recipient/results.json
            ${{ runner.temp }}/windows-recipient/commands.json
            ${{ runner.temp }}/windows-recipient/browser/*.json
            ${{ runner.temp }}/windows-recipient/browser/*.png
          if-no-files-found: error
          retention-days: 30
