          python3 north-star/prototype/tools/verify_feedback.py --godot "$veil_engine" --archive "$RUNNER_TEMP/crossing-rebuilt.zip" --output "$RUNNER_TEMP/rebuilt-feedback.json" --compare evidence/north-star-return-feedback/feedback.json
