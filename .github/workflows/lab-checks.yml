  integrity-and-dialogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate records, links and preserved sources
        run: python3 tools/validate_repo.py
      - name: Reject false laboratory, consumption and execution claims
        run: |
          python3 tools/check_transformation.py
          python3 tools/test_transformation.py
          python3 tools/test_inventory_origins.py
          python3 tools/inventory_origins.py --check labs/source-inventory.json
          python3 tools/test_ci_scope.py
      - name: Exercise validator failure detection
        run: python3 tools/test_validate_repo.py
      - name: Verify immutable brain sources and deterministic selective consultation
        run: |
          python3 tools/brain_query.py check
          python3 tools/test_brain_query.py
          python3 tools/benchmark_brain_query.py --output "$RUNNER_TEMP/brain-retrieval.json" --compare evidence/brain-retrieval/benchmark.json
      - name: Verify reference discovery and historical contribution boundaries
        run: |
          python3 tools/reference_library.py check
          python3 tools/test_reference_library.py
      - name: Exercise manifest omission and tampering detection
        run: python3 tools/test_check_manifest.py
      - name: Verify delivered Darsen reading editions and EPUB conformance
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          python3 projects/lich-cistern/tools/check_editions.py --edition all
          mkdir -p "$RUNNER_TEMP/darsen-epubcheck"
          curl --fail --location --output "$RUNNER_TEMP/darsen-epubcheck/tool.zip" https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          printf '%s  %s\n' 33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c "$RUNNER_TEMP/darsen-epubcheck/tool.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/darsen-epubcheck/tool.zip" -d "$RUNNER_TEMP/darsen-epubcheck"
          java -jar "$RUNNER_TEMP/darsen-epubcheck/epubcheck-5.4.0/epubcheck.jar" projects/lich-cistern/dist/a-agua-sob-darsen-0.1.0.epub
          java -jar "$RUNNER_TEMP/darsen-epubcheck/epubcheck-5.4.0/epubcheck.jar" projects/lich-cistern/dist/the-water-beneath-darsen-0.2.0.epub
          java -jar "$RUNNER_TEMP/darsen-epubcheck/epubcheck-5.4.0/epubcheck.jar" projects/lich-cistern/dist/a-agua-sob-darsen-0.3.0.epub
          java -jar "$RUNNER_TEMP/darsen-epubcheck/epubcheck-5.4.0/epubcheck.jar" projects/lich-cistern/dist/the-water-beneath-darsen-0.3.0.epub
      - name: Exercise Waystone scenes, rescue routes, CLI and provenance
        run: |
          python3 projects/waystone-dialogue/test_scene.py
          python3 projects/waystone-dialogue/test_adventure.py
      - name: Verify rendered Tokyo 80s audio and score contracts
        run: python3 projects/tokyo80s/tools/check_audio.py
      - name: Verify original-pitch rehearsal assets and encoded signal probes
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 projects/tokyo80s/tools/check_rehearsal_audio.py --signal
      - name: Require complete maintained lab coverage and matching hashes
        run: python3 tools/check_manifest.py

  chat-and-evaluation:
    needs: scope
    if: needs.scope.outputs.chat_evaluation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The evaluator and starter read pinned historical commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab/.node-version
          cache: npm
          cache-dependency-path: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab/package-lock.json
      - name: Install locked chat and evaluator dependencies
        run: npm ci --prefix projects/realtime-integration-lab
      - name: Install matching Chromium and Linux browser dependencies
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Require an executable browser
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab
        run: |
          browser_path="$(node -p "require('playwright-core').chromium.executablePath()")"
          test -x "$browser_path"
          "$browser_path" --version
          printf 'CHROMIUM_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
      - name: Reproduce the historical conversation window limitation
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab
        run: |
          git show 2e18f506e6c61b489bef740ef533866962b13d77:martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab/public/studio/client.js > "$RUNNER_TEMP/rooms-history-baseline.js"
          ROOMS_HISTORY_BASELINE_CLIENT="$RUNNER_TEMP/rooms-history-baseline.js" node --test tests/history-browser.test.cjs
      - name: Exercise real protocol and browser behavior
        timeout-minutes: 5
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab
        run: npm test
      - name: Exercise Tokyo 80s timing and complete audio/browser workflow
        run: node --test projects/tokyo80s/tests/*.test.mjs
      - name: Exercise Waystone browser journeys, saves and Python parity
        run: |
          python3 projects/waystone-dialogue/browser/tools/export_dialogue.py --check
          npm test --prefix projects/waystone-dialogue/browser
      - name: Exercise evaluator boundaries and failure attribution
        run: python3 evaluations/chat-send-buffering/test_runner.py
      - name: Reexecute frozen candidate with known defect and reference controls
        run: |
          python3 -m unittest discover -s labs/ai-evaluation -p 'test_*.py'
          python3 evaluations/chat-send-buffering/run.py prepare "$RUNNER_TEMP/ai-candidate"
          cp evidence/ai-evaluation/candidate-client.js "$RUNNER_TEMP/ai-candidate/public/client.js"
          python3 labs/ai-evaluation/run.py --protocol evidence/ai-evaluation/protocol.json --workspace "$RUNNER_TEMP/ai-candidate" --output "$RUNNER_TEMP/eval-calibration"
          python3 - "$RUNNER_TEMP/eval-calibration/RUN.json" <<'PYREPLAY'
          import json, sys
          from pathlib import Path
          actual = json.loads(Path(sys.argv[1]).read_text())
          expected = json.loads(Path('evidence/ai-evaluation/results.json').read_text())
          for key in ('status', 'candidate_status', 'candidate_counts', 'calibration', 'controls', 'identities'):
              assert actual[key] == expected[key], (key, actual[key], expected[key])
          PYREPLAY
      - name: Retain calibration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-calibration
          path: ${{ runner.temp }}/eval-calibration/*.json
          if-no-files-found: warn
          retention-days: 14

