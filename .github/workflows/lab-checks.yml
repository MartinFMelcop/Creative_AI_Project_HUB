name: Lab checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eclipse-economy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/eclipse-fair
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - name: Compile and exercise economy, agents, journal and terminal workflow
        run: |
          dotnet build Checks/Eclipse.Checks.csproj -c Release
          dotnet run --project Checks -c Release --no-build
          python3 tools/check_cli.py
      - name: Execute the delivered compiled package outside its source directory
        run: |
          mkdir -p "$RUNNER_TEMP/eclipse-pack"
          unzip -q dist/eclipse-fair-0.1.0.zip -d "$RUNNER_TEMP/eclipse-pack"
          python3 tools/check_cli.py "$RUNNER_TEMP/eclipse-pack/eclipse.dll"

  native-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/veil-arena
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify pinned Godot, run native gameplay and built resource packs
        run: |
          mkdir -p "$RUNNER_TEMP/veil-godot" "$RUNNER_TEMP/veil-data" "$RUNNER_TEMP/veil-config" "$RUNNER_TEMP/veil-cache"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/veil-godot/engine.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/veil-godot/engine.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/veil-godot/engine.zip" -d "$RUNNER_TEMP/veil-godot"
          veil_engine="$RUNNER_TEMP/veil-godot/Godot_v4.6.3-stable_linux.x86_64"
          chmod +x "$veil_engine"
          export XDG_DATA_HOME="$RUNNER_TEMP/veil-data" XDG_CONFIG_HOME="$RUNNER_TEMP/veil-config" XDG_CACHE_HOME="$RUNNER_TEMP/veil-cache"
          "$veil_engine" --headless --path . --editor --import --quit
          "$veil_engine" --headless --path . --script tests/encounter.gd --fixed-fps 60
          cp tests/encounter.gd "$RUNNER_TEMP/veil-godot/encounter.gd"
          "$veil_engine" --headless --main-pack "$PWD/dist/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/encounter.gd" --fixed-fps 60
          "$veil_engine" --headless --path . --export-pack Linux "$RUNNER_TEMP/veil-godot/rebuilt.pck"
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-godot/rebuilt.pck" --script "$RUNNER_TEMP/veil-godot/encounter.gd" --fixed-fps 60

  integrity-and-dialogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate records, links and preserved sources
        run: python3 tools/validate_repo.py
      - name: Exercise validator failure detection
        run: python3 tools/test_validate_repo.py
      - name: Exercise manifest omission and tampering detection
        run: python3 tools/test_check_manifest.py
      - name: Exercise Waystone scenes, rescue routes, CLI and provenance
        run: |
          python3 projects/waystone-dialogue/test_scene.py
          python3 projects/waystone-dialogue/test_adventure.py
      - name: Verify rendered Tokyo 80s audio and score contracts
        run: python3 projects/tokyo80s/tools/check_audio.py
      - name: Require complete maintained lab coverage and matching hashes
        run: python3 tools/check_manifest.py

  chat-and-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The evaluator and starter read pinned historical commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab/.node-version
          cache: npm
          cache-dependency-path: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab/package-lock.json
      - name: Install locked chat and evaluator dependencies
        run: npm ci --prefix projects/realtime-integration-lab
      - name: Install matching Chromium and Linux browser dependencies
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Require an executable browser
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab
        run: |
          browser_path="$(node -p "require('playwright-core').chromium.executablePath()")"
          test -x "$browser_path"
          "$browser_path" --version
          printf 'CHROMIUM_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
      - name: Exercise real protocol and browser behavior
        timeout-minutes: 5
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab
        run: npm test
      - name: Exercise Tokyo 80s timing and complete audio/browser workflow
        run: node --test projects/tokyo80s/tests/core.test.mjs projects/tokyo80s/tests/browser.test.mjs
      - name: Exercise Waystone browser journeys, saves and Python parity
        run: |
          python3 projects/waystone-dialogue/browser/tools/export_dialogue.py --check
          npm test --prefix projects/waystone-dialogue/browser
      - name: Exercise evaluator boundaries and failure attribution
        run: python3 evaluations/chat-send-buffering/test_runner.py
      - name: Require known baseline and reference outcomes
        run: python3 tools/check_calibration.py "$RUNNER_TEMP/eval-calibration"
      - name: Retain calibration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-calibration
          path: ${{ runner.temp }}/eval-calibration/*.json
          if-no-files-found: warn
          retention-days: 14
