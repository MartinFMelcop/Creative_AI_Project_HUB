name: Lab checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eclipse-economy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/eclipse-fair
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - name: Compile and exercise economy, agents, journal and terminal workflow
        run: |
          dotnet build Checks/Eclipse.Checks.csproj -c Release
          dotnet run --project Checks -c Release --no-build
          python3 tools/check_cli.py
      - name: Execute the delivered compiled package outside its source directory
        run: |
          mkdir -p "$RUNNER_TEMP/eclipse-pack"
          unzip -q dist/eclipse-fair-0.1.0.zip -d "$RUNNER_TEMP/eclipse-pack"
          python3 tools/check_cli.py "$RUNNER_TEMP/eclipse-pack/eclipse.dll"
      - name: Compile and execute the native C# board and delivered project pack
        run: |
          mkdir -p "$RUNNER_TEMP/eclipse-godot" "$RUNNER_TEMP/eclipse-board-pack"
          curl --fail --location --output "$RUNNER_TEMP/eclipse-godot/engine.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_mono_linux_x86_64.zip
          printf '%s  %s\n' 702a8a6785060203fd46373adf864586ecf0c377ac685d7107dde66b1eba0a9e "$RUNNER_TEMP/eclipse-godot/engine.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/eclipse-godot/engine.zip" -d "$RUNNER_TEMP/eclipse-godot"
          eclipse_engine="$RUNNER_TEMP/eclipse-godot/Godot_v4.6.3-stable_mono_linux_x86_64/Godot_v4.6.3-stable_mono_linux.x86_64"
          chmod +x "$eclipse_engine"
          export XDG_DATA_HOME="$RUNNER_TEMP/eclipse-data" XDG_CONFIG_HOME="$RUNNER_TEMP/eclipse-config" XDG_CACHE_HOME="$RUNNER_TEMP/eclipse-cache"
          dotnet build Native/Eclipse.Board.csproj -c Debug
          "$eclipse_engine" --headless --path Native --editor --import --quit
          "$eclipse_engine" --headless --path Native -- --verify --save-path "$RUNNER_TEMP/eclipse-source-check/match.json"
          python3 tools/check_board_pack.py
          unzip -q dist/eclipse-board-0.5.0.zip -d "$RUNNER_TEMP/eclipse-board-pack"
          "$eclipse_engine" --headless --path "$RUNNER_TEMP/eclipse-board-pack/eclipse-board/Native" -- --verify --save-path "$RUNNER_TEMP/eclipse-pack-check/match.json"
      - name: Compile and play Cinderwatch source, delivered and rebuilt consumers
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/cinderwatch
        run: |
          cinder_engine="$RUNNER_TEMP/eclipse-godot/Godot_v4.6.3-stable_mono_linux_x86_64/Godot_v4.6.3-stable_mono_linux.x86_64"
          export XDG_DATA_HOME="$RUNNER_TEMP/cinder-data" XDG_CONFIG_HOME="$RUNNER_TEMP/cinder-config" XDG_CACHE_HOME="$RUNNER_TEMP/cinder-cache"
          dotnet run --project Checks -c Release
          dotnet build Native/Cinder.Native.csproj -c Debug
          "$cinder_engine" --headless --path Native --editor --import --quit
          "$cinder_engine" --headless --path Native -- --verify --save-path "$RUNNER_TEMP/cinder-source/save.json"
          python3 tools/check_media.py
          python3 tools/check_pack.py
          unzip -q dist/cinderwatch-0.4.0.zip -d "$RUNNER_TEMP/cinder-delivered"
          "$cinder_engine" --headless --path "$RUNNER_TEMP/cinder-delivered/cinderwatch/Native" -- --verify --save-path "$RUNNER_TEMP/cinder-delivered-check/save.json"
          python3 tools/pack.py
          python3 tools/check_pack.py --assemblies
          unzip -q dist/cinderwatch-0.4.0.zip -d "$RUNNER_TEMP/cinder-rebuilt"
          "$cinder_engine" --headless --path "$RUNNER_TEMP/cinder-rebuilt/cinderwatch/Native" -- --verify --save-path "$RUNNER_TEMP/cinder-rebuilt-check/save.json"

      - name: Cache the verified Mono Linux release template
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/cinder-template/linux_release.x86_64
          key: godot-mono-4.6.3-linux-release-dde8bd2f5b6b8666
      - name: Execute delivered and freshly rebuilt Cinderwatch Linux players
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/cinderwatch
        run: |
          cinder_engine="$RUNNER_TEMP/eclipse-godot/Godot_v4.6.3-stable_mono_linux_x86_64/Godot_v4.6.3-stable_mono_linux.x86_64"
          cinder_template="$RUNNER_TEMP/cinder-template/linux_release.x86_64"
          mkdir -p "$RUNNER_TEMP/cinder-template" "$RUNNER_TEMP/cinder-linux-delivered" "$RUNNER_TEMP/cinder-linux-rebuilt"
          if [ ! -f "$cinder_template" ]; then
            curl --fail --location --output "$RUNNER_TEMP/cinder-template/templates.tpz" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_mono_export_templates.tpz
            printf '%s  %s\n' 6436f474ee085fb0a94d3d296b9821736bdd663b6e91b2228fdf77066f1d1400 "$RUNNER_TEMP/cinder-template/templates.tpz" | sha256sum --check
            unzip -p "$RUNNER_TEMP/cinder-template/templates.tpz" templates/linux_release.x86_64 > "$cinder_template"
          fi
          printf '%s  %s\n' dde8bd2f5b6b8666c3656a57900f8c4163b3fc9799cc723746ca88468333b320 "$cinder_template" | sha256sum --check
          python3 tools/check_linux.py
          unzip -q dist/cinderwatch-linux-0.4.0.zip -d "$RUNNER_TEMP/cinder-linux-delivered"
          env -u DOTNET_ROOT -u DOTNET_ROOT_X64 PATH=/usr/bin:/bin DOTNET_MULTILEVEL_LOOKUP=0 "$RUNNER_TEMP/cinder-linux-delivered/Cinderwatch/cinderwatch.x86_64" --headless -- --verify --save-path "$RUNNER_TEMP/cinder-linux-check/save.json"
          python3 tools/export_linux.py --godot "$cinder_engine" --template "$cinder_template" --output "$RUNNER_TEMP/cinder-rebuilt-linux.zip"
          python3 tools/check_linux.py "$RUNNER_TEMP/cinder-rebuilt-linux.zip"
          unzip -q "$RUNNER_TEMP/cinder-rebuilt-linux.zip" -d "$RUNNER_TEMP/cinder-linux-rebuilt"
          env -u DOTNET_ROOT -u DOTNET_ROOT_X64 PATH=/usr/bin:/bin DOTNET_MULTILEVEL_LOOKUP=0 "$RUNNER_TEMP/cinder-linux-rebuilt/Cinderwatch/cinderwatch.x86_64" --headless -- --verify --save-path "$RUNNER_TEMP/cinder-linux-rebuilt-check/save.json"

      - name: Verify Eclipse Fair standalone player and independently rebuild it
        run: |
          eclipse_engine="$RUNNER_TEMP/eclipse-godot/Godot_v4.6.3-stable_mono_linux_x86_64/Godot_v4.6.3-stable_mono_linux.x86_64"
          python3 tools/check_linux.py
          python3 tools/test_check_linux.py
          mkdir -p "$RUNNER_TEMP/eclipse-player"
          unzip -q dist/eclipse-fair-linux-0.5.0.zip -d "$RUNNER_TEMP/eclipse-player"
          player="$RUNNER_TEMP/eclipse-player/EclipseFair/eclipse-fair.x86_64"
          test -x "$player"
          env PATH=/usr/bin:/bin DOTNET_ROOT=/nonexistent DOTNET_ROOT_X64=/nonexistent "$player" --headless -- --verify --save-path "$RUNNER_TEMP/eclipse-release-check/match.json"
          python3 tools/export_linux.py --godot "$eclipse_engine" --template "$RUNNER_TEMP/cinder-template/linux_release.x86_64" --output "$RUNNER_TEMP/eclipse-rebuilt-linux.zip"
          python3 tools/check_linux.py "$RUNNER_TEMP/eclipse-rebuilt-linux.zip"
          unzip -q "$RUNNER_TEMP/eclipse-rebuilt-linux.zip" -d "$RUNNER_TEMP/eclipse-rebuilt-player"
          env PATH=/usr/bin:/bin DOTNET_ROOT=/nonexistent DOTNET_ROOT_X64=/nonexistent "$RUNNER_TEMP/eclipse-rebuilt-player/EclipseFair/eclipse-fair.x86_64" --headless -- --verify --save-path "$RUNNER_TEMP/eclipse-rebuilt-check/match.json"

  native-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/veil-arena
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify pinned Godot, run native gameplay and built resource packs
        run: |
          mkdir -p "$RUNNER_TEMP/veil-godot" "$RUNNER_TEMP/veil-data" "$RUNNER_TEMP/veil-config" "$RUNNER_TEMP/veil-cache"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/veil-godot/engine.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/veil-godot/engine.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/veil-godot/engine.zip" -d "$RUNNER_TEMP/veil-godot"
          veil_engine="$RUNNER_TEMP/veil-godot/Godot_v4.6.3-stable_linux.x86_64"
          chmod +x "$veil_engine"
          export XDG_DATA_HOME="$RUNNER_TEMP/veil-data" XDG_CONFIG_HOME="$RUNNER_TEMP/veil-config" XDG_CACHE_HOME="$RUNNER_TEMP/veil-cache"
          "$veil_engine" --headless --path . --editor --import --quit
          python3 tools/check_media.py
          "$veil_engine" --headless --path . --script tests/encounter.gd --fixed-fps 60
          "$veil_engine" --headless --path . --script tests/presentation.gd
          "$veil_engine" --headless --path . --script tests/motion.gd
          "$veil_engine" --headless --path . --script tests/controls.gd --fixed-fps 60
          "$veil_engine" --headless --path . --script tests/parry.gd --fixed-fps 60
          "$veil_engine" --headless --path . --script tests/practice.gd --fixed-fps 60
          "$veil_engine" --headless --path . --script tests/audio_reset.gd
          cp tests/encounter.gd "$RUNNER_TEMP/veil-godot/encounter.gd"
          cp tests/presentation.gd "$RUNNER_TEMP/veil-godot/presentation.gd"
          cp tests/motion.gd "$RUNNER_TEMP/veil-godot/motion.gd"
          cp tests/controls.gd "$RUNNER_TEMP/veil-godot/controls.gd"
          cp tests/parry.gd "$RUNNER_TEMP/veil-godot/parry.gd"
          cp tests/practice.gd "$RUNNER_TEMP/veil-godot/practice.gd"
          cp tests/audio_reset.gd "$RUNNER_TEMP/veil-godot/audio_reset.gd"
          "$veil_engine" --headless --main-pack "$PWD/dist/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/encounter.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$PWD/dist/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/presentation.gd"
          "$veil_engine" --headless --main-pack "$PWD/dist/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/motion.gd"
          "$veil_engine" --headless --main-pack "$PWD/dist/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/controls.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$PWD/dist/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/parry.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$PWD/dist/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/practice.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$PWD/dist/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/audio_reset.gd"
          "$veil_engine" --headless --path . --export-pack Linux "$RUNNER_TEMP/veil-godot/rebuilt.pck"
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-godot/rebuilt.pck" --script "$RUNNER_TEMP/veil-godot/encounter.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-godot/rebuilt.pck" --script "$RUNNER_TEMP/veil-godot/presentation.gd"
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-godot/rebuilt.pck" --script "$RUNNER_TEMP/veil-godot/motion.gd"
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-godot/rebuilt.pck" --script "$RUNNER_TEMP/veil-godot/controls.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-godot/rebuilt.pck" --script "$RUNNER_TEMP/veil-godot/parry.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-godot/rebuilt.pck" --script "$RUNNER_TEMP/veil-godot/practice.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-godot/rebuilt.pck" --script "$RUNNER_TEMP/veil-godot/audio_reset.gd"
      - name: Verify delivered Linux player and rebuild the actual release export
        run: |
          veil_engine="$RUNNER_TEMP/veil-godot/Godot_v4.6.3-stable_linux.x86_64"
          export XDG_DATA_HOME="$RUNNER_TEMP/veil-release-data" XDG_CONFIG_HOME="$RUNNER_TEMP/veil-release-config" XDG_CACHE_HOME="$RUNNER_TEMP/veil-release-cache"
          python3 tools/check_linux.py
          unzip -q dist/veilbreak-linux-0.6.0.zip -d "$RUNNER_TEMP/veil-delivered-player"
          player="$RUNNER_TEMP/veil-delivered-player/Veilbreak/veilbreak.x86_64"
          test -x "$player"
          "$player" --headless --quit-after 10
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-delivered-player/Veilbreak/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/encounter.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-delivered-player/Veilbreak/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/presentation.gd"
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-delivered-player/Veilbreak/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/motion.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-delivered-player/Veilbreak/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/controls.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-delivered-player/Veilbreak/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/parry.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-delivered-player/Veilbreak/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/practice.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-delivered-player/Veilbreak/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/audio_reset.gd"
          curl --fail --location --output "$RUNNER_TEMP/veil-godot/templates.tpz" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          python3 tools/export_linux.py --godot "$veil_engine" --templates "$RUNNER_TEMP/veil-godot/templates.tpz" --output "$RUNNER_TEMP/veil-rebuilt-linux.zip"
          python3 tools/check_linux.py "$RUNNER_TEMP/veil-rebuilt-linux.zip"
          unzip -q "$RUNNER_TEMP/veil-rebuilt-linux.zip" -d "$RUNNER_TEMP/veil-rebuilt-player"
          "$RUNNER_TEMP/veil-rebuilt-player/Veilbreak/veilbreak.x86_64" --headless --quit-after 10
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-rebuilt-player/Veilbreak/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/controls.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-rebuilt-player/Veilbreak/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/parry.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-rebuilt-player/Veilbreak/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/practice.gd" --fixed-fps 60
          "$veil_engine" --headless --main-pack "$RUNNER_TEMP/veil-rebuilt-player/Veilbreak/veilbreak.pck" --script "$RUNNER_TEMP/veil-godot/audio_reset.gd"

  integrity-and-dialogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate records, links and preserved sources
        run: python3 tools/validate_repo.py
      - name: Exercise validator failure detection
        run: python3 tools/test_validate_repo.py
      - name: Verify reference discovery and historical contribution boundaries
        run: |
          python3 tools/reference_library.py check
          python3 tools/test_reference_library.py
      - name: Exercise manifest omission and tampering detection
        run: python3 tools/test_check_manifest.py
      - name: Verify delivered Darsen reading editions and EPUB conformance
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          python3 projects/lich-cistern/tools/check_editions.py --edition all
          mkdir -p "$RUNNER_TEMP/darsen-epubcheck"
          curl --fail --location --output "$RUNNER_TEMP/darsen-epubcheck/tool.zip" https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          printf '%s  %s\n' 33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c "$RUNNER_TEMP/darsen-epubcheck/tool.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/darsen-epubcheck/tool.zip" -d "$RUNNER_TEMP/darsen-epubcheck"
          java -jar "$RUNNER_TEMP/darsen-epubcheck/epubcheck-5.4.0/epubcheck.jar" projects/lich-cistern/dist/a-agua-sob-darsen-0.1.0.epub
          java -jar "$RUNNER_TEMP/darsen-epubcheck/epubcheck-5.4.0/epubcheck.jar" projects/lich-cistern/dist/the-water-beneath-darsen-0.2.0.epub
      - name: Exercise Waystone scenes, rescue routes, CLI and provenance
        run: |
          python3 projects/waystone-dialogue/test_scene.py
          python3 projects/waystone-dialogue/test_adventure.py
      - name: Verify rendered Tokyo 80s audio and score contracts
        run: python3 projects/tokyo80s/tools/check_audio.py
      - name: Verify original-pitch rehearsal assets and encoded signal probes
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 projects/tokyo80s/tools/check_rehearsal_audio.py --signal
      - name: Require complete maintained lab coverage and matching hashes
        run: python3 tools/check_manifest.py

  chat-and-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The evaluator and starter read pinned historical commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab/.node-version
          cache: npm
          cache-dependency-path: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab/package-lock.json
      - name: Install locked chat and evaluator dependencies
        run: npm ci --prefix projects/realtime-integration-lab
      - name: Install matching Chromium and Linux browser dependencies
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Require an executable browser
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab
        run: |
          browser_path="$(node -p "require('playwright-core').chromium.executablePath()")"
          test -x "$browser_path"
          "$browser_path" --version
          printf 'CHROMIUM_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
      - name: Exercise real protocol and browser behavior
        timeout-minutes: 5
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab/projects/realtime-integration-lab
        run: npm test
      - name: Exercise Tokyo 80s timing and complete audio/browser workflow
        run: node --test projects/tokyo80s/tests/*.test.mjs
      - name: Exercise Waystone browser journeys, saves and Python parity
        run: |
          python3 projects/waystone-dialogue/browser/tools/export_dialogue.py --check
          npm test --prefix projects/waystone-dialogue/browser
      - name: Exercise evaluator boundaries and failure attribution
        run: python3 evaluations/chat-send-buffering/test_runner.py
      - name: Require known baseline and reference outcomes
        run: python3 tools/check_calibration.py "$RUNNER_TEMP/eval-calibration"
      - name: Retain calibration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-calibration
          path: ${{ runner.temp }}/eval-calibration/*.json
          if-no-files-found: warn
          retention-days: 14
