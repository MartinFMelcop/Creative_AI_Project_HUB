          python3 north-star/prototype/tools/verify_linux.py --archive "$RUNNER_TEMP/crossing-rebuilt.zip" --output "$RUNNER_TEMP/crossing-rebuilt.json" --compare evidence/north-star-return-feedback/results.json
          python3 north-star/prototype/tools/fittings.py verify --godot "$veil_engine" --archive "$RUNNER_TEMP/crossing-rebuilt.zip" --output "$RUNNER_TEMP/rebuilt-fittings.json" --compare evidence/north-star-return-feedback/fittings.json
          python3 north-star/prototype/tools/verify_gamepad.py --godot "$veil_engine" --archive north-star/prototype/dist/crossing-drill-linux-0.5.0.zip --output "$RUNNER_TEMP/mapped-pad.json" --compare evidence/north-star-return-feedback/gamepad.json
          python3 north-star/prototype/tools/verify_gamepad.py --godot "$veil_engine" --archive "$RUNNER_TEMP/crossing-rebuilt.zip" --output "$RUNNER_TEMP/rebuilt-pad.json" --compare evidence/north-star-return-feedback/gamepad.json

      - name: Execute preserved visual production method and counterexamples
        working-directory: martin-creative-ai-lab-v0.2.0/martin-creative-ai-lab
